name: Build APK (Vulkan GPU)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Vulkan host tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev pkg-config cmake ninja-build
          which glslc
          glslc --version

      - name: Unzip project
        run: |
          set -e
          Z=$(ls *.zip | LC_ALL=C sort | tail -1)
          echo "Using zip: $Z"
          rm -rf work
          unzip -o "$Z" -d work
          test -f work/iChatOffline/settings.gradle.kts
          test -f work/iChatOffline/app/src/main/cpp/CMakeLists.txt

      - name: Fetch llama.cpp
        run: |
          set -e
          git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp > /tmp/llama-tags.txt
          T=$(grep -o "refs/tags/b[0-9][0-9]*" /tmp/llama-tags.txt | sed "s|refs/tags/||" | sort -V | tail -1)
          echo "llama tag=$T"
          test -n "$T"
          CPP=work/iChatOffline/app/src/main/cpp
          rm -rf "$CPP/llama.cpp"
          git clone --depth 1 --branch "$T" https://github.com/ggml-org/llama.cpp "$CPP/llama.cpp"
          rm -rf "$CPP/llama.cpp/.git"

      - name: Install SPIRV-Headers and Vulkan-Headers properly
        run: |
          set -e
          rm -rf /tmp/vulkan-sdk
          mkdir -p /tmp/vulkan-sdk

          # تثبيت SPIRV-Headers بالمسار الصحيح
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spv-src
          cmake -S /tmp/spv-src -B /tmp/spv-build -DCMAKE_INSTALL_PREFIX=/tmp/vulkan-sdk
          cmake --install /tmp/spv-build

          # تثبيت Vulkan-Headers بالمسار الصحيح
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vkh-src
          cmake -S /tmp/vkh-src -B /tmp/vkh-build -DCMAKE_INSTALL_PREFIX=/tmp/vulkan-sdk
          cmake --install /tmp/vkh-build

          echo "CMAKE_PREFIX_PATH=/tmp/vulkan-sdk" >> $GITHUB_ENV
          echo "Vulkan_GLSLC_EXECUTABLE=$(which glslc)" >> $GITHUB_ENV

      - name: Clean CMake Cache & Build APK
        working-directory: work/iChatOffline
        env:
          CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}
          Vulkan_GLSLC_EXECUTABLE: ${{ env.Vulkan_GLSLC_EXECUTABLE }}
        run: |
          set -e
          # مسح الكاش القديم لمنع خطأ Ninja Dirty manifest نهائياً
          rm -rf app/.cxx app/build
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iChat-debug-apk-gpu
          path: work/iChatOffline/app/build/outputs/apk/debug/*.apk
