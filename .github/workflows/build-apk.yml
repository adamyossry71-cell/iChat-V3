name: Build APK (Vulkan GPU)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Vulkan host tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev pkg-config cmake ninja-build
          which glslc
          glslc --version

      - name: Unzip project
        run: |
          set -e
          Z=$(ls *.zip | LC_ALL=C sort | tail -1)
          echo "Using zip: $Z"
          rm -rf work
          unzip -o "$Z" -d work
          test -f work/iChatOffline/settings.gradle.kts
          test -f work/iChatOffline/app/src/main/cpp/CMakeLists.txt

      - name: Fetch llama.cpp and Vulkan Headers
        run: |
          set -e
          git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp > /tmp/llama-tags.txt
          T=$(grep -o "refs/tags/b[0-9][0-9]*" /tmp/llama-tags.txt | sed "s|refs/tags/||" | sort -V | tail -1)
          echo "llama tag=$T"
          test -n "$T"
          CPP=work/iChatOffline/app/src/main/cpp
          rm -rf "$CPP/llama.cpp"
          git clone --depth 1 --branch "$T" https://github.com/ggml-org/llama.cpp "$CPP/llama.cpp"
          
          VULKAN_SRC="$CPP/llama.cpp/ggml/src/ggml-vulkan"
          rm -rf "$VULKAN_SRC/SPIRV-Headers" "$VULKAN_SRC/Vulkan-Headers"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$VULKAN_SRC/SPIRV-Headers"
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$VULKAN_SRC/Vulkan-Headers"
          
          rm -rf "$CPP/llama.cpp/.git"

      - name: Patch ggml-vulkan CMakeLists and Fix Timestamps
        run: |
          set -e
          VULKAN_CMAKE="work/iChatOffline/app/src/main/cpp/llama.cpp/ggml/src/ggml-vulkan/CMakeLists.txt"
          
          sed -i 's/ CONFIGURE_DEPENDS//' "$VULKAN_CMAKE" || true
          
          echo "include_directories(\${CMAKE_CURRENT_SOURCE_DIR}/SPIRV-Headers/include)" >> "$VULKAN_CMAKE"
          echo "include_directories(\${CMAKE_CURRENT_SOURCE_DIR}/Vulkan-Headers/include)" >> "$VULKAN_CMAKE"
          
          find work/iChatOffline/app/src/main/cpp -type f -exec touch {} +

      - name: Build APK
        working-directory: work/iChatOffline
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iChat-debug-apk-gpu
          path: work/iChatOffline/app/build/outputs/apk/debug/*.apk
