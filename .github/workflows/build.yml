name: Build APK (Vulkan GPU)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install host Vulkan tools (glslc)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev pkg-config cmake ninja-build
          which glslc
          glslc --version || true

      - name: Unzip project (newest zip by name)
        run: |
          set -e
          Z=$(ls *.zip | LC_ALL=C sort | tail -1)
          echo "Using $Z"
          rm -rf work
          unzip -o "$Z" -d work
          test -f work/iChatOffline/settings.gradle.kts
          grep -n 'GGML_VULKAN' work/iChatOffline/app/src/main/cpp/CMakeLists.txt

      - name: Get llama.cpp + SPIRV-Headers and write gpu-paths.cmake
        run: |
          set -e
          T=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp \
            | grep -oE 'refs/tags/b7[3-6][0-9]{2}$' \
            | sed 's#refs/tags/##' \
            | sort -V \
            | tail -1)
          if [ -z "$T" ]; then
            T=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp \
              | grep -oE 'refs/tags/b[0-9]+$' \
              | sed 's#refs/tags/##' \
              | sort -V \
              | tail -1)
          fi
          echo "Using llama.cpp tag: $T"
          test -n "$T"
          CPP_DIR="work/iChatOffline/app/src/main/cpp"
          rm -rf "$CPP_DIR/llama.cpp"
          git clone --depth 1 --branch "$T" https://github.com/ggml-org/llama.cpp "$CPP_DIR/llama.cpp"
          test -f "$CPP_DIR/llama.cpp/tools/mtmd/mtmd.h"

          rm -rf /tmp/SPIRV-Headers-src /tmp/SPIRV-Headers-build /tmp/SPIRV-Headers-install
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers-src
          cmake -S /tmp/SPIRV-Headers-src -B /tmp/SPIRV-Headers-build -DCMAKE_INSTALL_PREFIX=/tmp/SPIRV-Headers-install
          cmake --install /tmp/SPIRV-Headers-build

          GLSLC=$(which glslc)
          echo "glslc=$GLSLC"
          test -x "$GLSLC"
          test -d /tmp/SPIRV-Headers-install

          # ملف يقرأه CMakeLists مباشرة (أثبت من env عبر Gradle)
          cat > "$CPP_DIR/gpu-paths.cmake" <<EOF
set(Vulkan_GLSLC_EXECUTABLE "$GLSLC" CACHE FILEPATH "" FORCE)
list(APPEND CMAKE_PREFIX_PATH "/tmp/SPIRV-Headers-install")
set(CMAKE_PREFIX_PATH "\${CMAKE_PREFIX_PATH}" CACHE STRING "" FORCE)
message(STATUS "gpu-paths: glslc=\${Vulkan_GLSLC_EXECUTABLE}")
message(STATUS "gpu-paths: PREFIX=\${CMAKE_PREFIX_PATH}")
EOF
          echo "---- gpu-paths.cmake ----"
          cat "$CPP_DIR/gpu-paths.cmake"

      - name: Build debug APK (Vulkan)
        working-directory: work/iChatOffline
        run: |
          set -e
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload cmake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            work/iChatOffline/app/.cxx/**/CMake*.log
            work/iChatOffline/app/.cxx/**/output.log
            work/iChatOffline/app/build/**/*.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iChat-debug-apk-gpu
          path: work/iChatOffline/app/build/outputs/apk/debug/*.apk
