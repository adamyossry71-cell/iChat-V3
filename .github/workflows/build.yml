name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unzip project (newest zip by name)
        run: |
          Z=$(ls *.zip | LC_ALL=C sort | tail -1)
          echo "Using $Z"
          unzip -o "$Z" -d work
      - name: Get llama.cpp
        run: git clone --depth 1 --branch b5000 https://github.com/ggml-org/llama.cpp work/iChatOffline/app/src/main/cpp/llama.cpp
      - name: Build debug APK
        working-directory: work/iChatOffline
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iChat-debug-apk
          path: work/iChatOffline/app/build/outputs/apk/debug/*.apk
