name: Build APK (Vulkan GPU)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install host Vulkan tools (glslc)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev pkg-config cmake ninja-build
          which glslc
          glslc --version || true
          echo "Vulkan_GLSLC_EXECUTABLE=$(which glslc)" >> $GITHUB_ENV
          echo "VULKAN_GLSLC=$(which glslc)" >> $GITHUB_ENV

      - name: Unzip project (newest zip by name)
        run: |
          set -e
          Z=$(ls *.zip | LC_ALL=C sort | tail -1)
          echo "Using $Z"
          rm -rf work
          unzip -o "$Z" -d work
          test -f work/iChatOffline/settings.gradle.kts
          grep -q 'GGML_VULKAN ON' work/iChatOffline/app/src/main/cpp/CMakeLists.txt

      - name: Get llama.cpp + SPIRV-Headers
        run: |
          set -e
          T=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp \
            | grep -oE 'refs/tags/b7[3-6][0-9]{2}$' \
            | sed 's#refs/tags/##' \
            | sort -V \
            | tail -1)
          if [ -z "$T" ]; then
            T=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp \
              | grep -oE 'refs/tags/b[0-9]+$' \
              | sed 's#refs/tags/##' \
              | sort -V \
              | tail -1)
          fi
          echo "Using llama.cpp tag: $T"
          test -n "$T"
          CPP_DIR="work/iChatOffline/app/src/main/cpp"
          rm -rf "$CPP_DIR/llama.cpp"
          git clone --depth 1 --branch "$T" https://github.com/ggml-org/llama.cpp "$CPP_DIR/llama.cpp"
          test -f "$CPP_DIR/llama.cpp/tools/mtmd/mtmd.h"

          # SPIRV-Headers (CONFIG package) — مهم لـ ggml-vulkan
          rm -rf "$CPP_DIR/SPIRV-Headers" /tmp/SPIRV-Headers-src /tmp/SPIRV-Headers-build /tmp/SPIRV-Headers-install
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/SPIRV-Headers-src
          cmake -S /tmp/SPIRV-Headers-src -B /tmp/SPIRV-Headers-build -DCMAKE_INSTALL_PREFIX=/tmp/SPIRV-Headers-install
          cmake --install /tmp/SPIRV-Headers-build
          echo "CMAKE_PREFIX_PATH=/tmp/SPIRV-Headers-install" >> $GITHUB_ENV
          echo "SPIRV_HEADERS_INSTALL=/tmp/SPIRV-Headers-install" >> $GITHUB_ENV

      - name: Build debug APK (Vulkan)
        working-directory: work/iChatOffline
        env:
          Vulkan_GLSLC_EXECUTABLE: ${{ env.Vulkan_GLSLC_EXECUTABLE }}
          VULKAN_GLSLC: ${{ env.VULKAN_GLSLC }}
          CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}
        run: |
          set -e
          echo "glslc=$Vulkan_GLSLC_EXECUTABLE"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH"
          # مرر المسارات لـ CMake عبر Gradle
          printf '\nandroid.defaults.buildfeatures.prefab=true\n' >> gradle.properties || true
          gradle assembleDebug --no-daemon --stacktrace \
            -Pandroid.native.buildOutput=verbose

      - uses: actions/upload-artifact@v4
        with:
          name: iChat-debug-apk-gpu
          path: work/iChatOffline/app/build/outputs/apk/debug/*.apk
