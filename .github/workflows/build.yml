name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unzip project (newest zip by name)
        run: |
          Z=$(ls *.zip | LC_ALL=C sort | tail -1)
          echo "Using $Z"
          unzip -o "$Z" -d work
      - name: Get llama.cpp (أحدث تاج رقمي b*)
        run: |
          T=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp \
            | grep -oE 'refs/tags/b[0-9]+$' \
            | sed 's#refs/tags/##' \
            | sort -V \
            | tail -1)
          echo "Using llama.cpp tag: $T"
          test -n "$T"
          git clone --depth 1 --branch "$T" https://github.com/ggml-org/llama.cpp work/iChatOffline/app/src/main/cpp/llama.cpp
          test -f work/iChatOffline/app/src/main/cpp/llama.cpp/tools/mtmd/mtmd.h
      - name: Build debug APK
        working-directory: work/iChatOffline
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iChat-debug-apk
          path: work/iChatOffline/app/build/outputs/apk/debug/*.apk
