name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unzip project (newest zip by name)
        run: |
          Z=$(ls *.zip | LC_ALL=C sort | tail -1)
          echo "Using $Z"
          unzip -o "$Z" -d work
      - name: Get llama.cpp and SPIRV-Headers
        run: |
          T=$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp \
            | grep -oE 'refs/tags/b[0-9]+$' \
            | sed 's#refs/tags/##' \
            | sort -V \
            | tail -1)
          echo "Using llama.cpp tag: $T"
          test -n "$T"
          CPP_DIR="work/iChatOffline/app/src/main/cpp"
          git clone --depth 1 --branch "$T" https://github.com/ggml-org/llama.cpp "$CPP_DIR/llama.cpp"
          
          # استنساخ مكتبة SPIRV-Headers رسمياً لحل مشكلة الـ Vulkan على أندرويد
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$CPP_DIR/SPIRV-Headers"
      - name: Build debug APK
        working-directory: work/iChatOffline
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: iChat-debug-apk
          path: work/iChatOffline/app/build/outputs/apk/debug/*.apk
